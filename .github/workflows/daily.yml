name: Stickman Animation Generator

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Generate video
        run: python stickman_animation.py

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: Stickman-Animation
          path: stickman_video.mp4
